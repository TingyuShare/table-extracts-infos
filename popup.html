<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      color: #333;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 15px;
      text-align: center;
    }
    .config-card {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .form-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    .form-group label {
      color: #495057;
    }
    .form-group input {
      width: 60px;
      padding: 4px 6px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
    }
    .info-panel {
      font-size: 12px;
      background-color: #e7f5ff;
      border: 1px solid #d0ebff;
      color: #1864ab;
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 8px 12px;
      border: 1px solid #007bff;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #adb5bd;
      border-color: #adb5bd;
      cursor: not-allowed;
    }
    button.secondary {
      background-color: #6c757d;
      border-color: #6c757d;
    }
    button.secondary:hover {
      background-color: #5a6268;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h3>Table Extractor Pro</h3>

  <!-- 过滤条件设置面板 -->
  <div class="config-card">
    <div class="form-group">
      <label for="startRow">起始行 (N):</label>
      <input type="number" id="startRow" value="0" min="0">
    </div>
    <div class="form-group">
      <label for="minRows">至少有 (M) 行数据:</label>
      <input type="number" id="minRows" value="2" min="1">
    </div>
  </div>

  <!-- 表格统计指示面板 -->
  <div class="info-panel" id="infoPanel">
    正在检测页面表格...
  </div>

  <div class="btn-group">
    <button id="exportExcel">导出符合条件的表格 (Excel)</button>
    <button id="exportJson" class="secondary">导出符合条件的表格 (JSON)</button>
  </div>

  <div id="status" class="status"></div>

  <script src="xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
